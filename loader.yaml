name: wdg-loader
description: >-
  Installs and updates the wdg data generator workflows published in
  github.com/lnetto/elastic-workflows-datagen (main): installs the integrations its index.json
  lists, then creates each workflow, or updates it when the published
  YAML has changed. Generators arrive off; one switched on here stays on. Runs
  every 60m; run it by hand after a publish to pick changes up now.
enabled: true
tags: [wdg]

triggers:
  - type: manual
  - type: scheduled
    with:
      every: 60m

consts:
  repo: lnetto/elastic-workflows-datagen
  ref: main

steps:
  # Pin this run to one commit: raw.githubusercontent.com caches a
  # branch URL for minutes, per edge, so index.json and the files it
  # lists could come from different commits. A commit URL never
  # changes. Without the API (60 calls/hour unauthenticated), fall back
  # to the branch.
  - name: head
    type: http
    on-failure:
      continue: true
    with:
      method: GET
      url: "https://api.github.com/repos/{{ consts.repo }}/git/ref/heads/{{ consts.ref }}"
      headers:
        Accept: application/vnd.github+json
        User-Agent: wdg-loader

  - name: pin
    type: data.set
    with:
      base: "https://raw.githubusercontent.com/{{ consts.repo }}/{% if steps.head.error == nil %}{{ steps.head.output.data.object.sha }}{% else %}{{ consts.ref }}{% endif %}"

  - name: index
    type: http
    with:
      method: GET
      url: "{{ variables.base }}/index.json"

  - name: parse
    type: data.set
    with:
      idx: "${{ steps.index.output.data | json_parse }}"

  - name: integrations
    type: foreach
    foreach: "${{ variables.idx.integrations }}"
    steps:
      - name: install_integration
        type: kibana.request
        on-failure:
          continue: true
        with:
          method: POST
          path: "/api/fleet/epm/packages/{{ foreach.item }}"
          body: {}

  - name: sync
    type: foreach
    foreach: "${{ variables.idx.workflows }}"
    steps:
      - name: fetch
        type: http
        with:
          method: GET
          url: "{{ variables.base }}/{{ foreach.item.file }}"

      - name: current
        type: kibana.request
        on-failure:
          continue: true
        with:
          method: GET
          path: "/api/workflows/workflow/{{ foreach.item.id }}"

      # Generators are published switched off. Kibana takes on/off
      # from the YAML, not the request, so one switched on in the
      # cluster stays on by flipping that header line (generators
      # only: the loader's own YAML is left exactly as published)
      - name: desired
        type: data.set
        with:
          yml: "${{ steps.fetch.output.data }}"

      - name: keep_enabled
        type: data.set
        if: "${{ steps.current.error == nil and steps.current.output.enabled == true and foreach.item.kind != 'loader' }}"
        with:
          yml: "${{ steps.fetch.output.data | replace_first: 'enabled: false', 'enabled: true' }}"

      # a failure here (say, a concurrent run created it first) must
      # not stop the rest of the sync
      - name: create
        type: kibana.request
        on-failure:
          continue: true
        if: "${{ steps.current.error != nil }}"
        with:
          method: POST
          path: /api/workflows/workflow
          body:
            id: "{{ foreach.item.id }}"
            yaml: "${{ variables.yml }}"

      - name: update
        type: kibana.request
        on-failure:
          continue: true
        if: "${{ steps.current.error == nil and steps.current.output.yaml != variables.yml }}"
        with:
          method: PUT
          path: "/api/workflows/workflow/{{ foreach.item.id }}"
          body:
            name: "{{ foreach.item.id }}"
            tags: [wdg]
            yaml: "${{ variables.yml }}"
