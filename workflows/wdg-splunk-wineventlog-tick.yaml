settings:
  liquid:
    parseLimit: 600000
    renderLimit: 2000
    memoryLimit: 60000000
name: wdg-splunk-wineventlog-tick
description: 'Generates Windows event logs (Splunk classic WinEventLog) data every 5 minutes
  into logs-windows.splunk_wineventlog-default. A 66-host AD estate -- two DCs, file/SQL/app/web
  servers, sixty workstations -- producing Security, System and Application events in Splunk''s
  classic WinEventLog rendering, byte-for-byte as a Universal Forwarder ships them: logons
  with their Kerberos tickets and logoffs, process creation, file share access, service churn,
  crashes, patch reboots, password spraying and admin activity. Parsed into Splunk TA fields
  and ECS/winlog by the workflow''s own ingest pipeline.'
enabled: false

triggers:
  - type: scheduled
    with:
      every: 5m

