      body: {"description": "Splunk classic WinEventLog -> Splunk TA fields + ECS/winlog (elastic-workflows-datagen)", "processors": [{"set": {"field": "event.original", "copy_from": "message", "override": false}}, {"script": {"lang": "painless", "source": "\nString NL = String.valueOf((char) 10);\nString CRc = String.valueOf((char) 13);\nString TAB = String.valueOf((char) 9);\nString raw = ctx.event?.original;\nif (raw == null) { return; }\nint mi = raw.indexOf(NL + \"Message=\");\nString head = mi >= 0 ? raw.substring(0, mi) : raw;\nString msg = mi >= 0 ? raw.substring(mi + 9) : \"\";\n\n// ---- header: timestamp line, then Key=Value lines\nMap ta = new LinkedHashMap();\nint nl = head.indexOf(NL);\nctx._wdg = new HashMap();\nctx._wdg.ts = (nl >= 0 ? head.substring(0, nl) : head).trim();\nint p = nl + 1;\nwhile (p > 0 && p < head.length()) {\n  int e = head.indexOf(NL, p); if (e < 0) { e = head.length(); }\n  String line = head.substring(p, e);\n  int eq = line.indexOf(\"=\");\n  if (eq > 0) { ta.put(line.substring(0, eq), line.substring(eq + 1).trim()); }\n  p = e + 1;\n}\nString code = ta.containsKey(\"EventCode\") ? ta.get(\"EventCode\") : \"\";\n\n// ---- message: Label:<tabs>Value lines, sections, continuations\nMap ed = new LinkedHashMap();\nMap kv = new LinkedHashMap();\nString section = \"\";\nString lastTa = null; String lastEd = null;\nint q = 0;\nwhile (q < msg.length()) {\n  int e = msg.indexOf(NL, q); if (e < 0) { e = msg.length(); }\n  String line = msg.substring(q, e);\n  q = e + 1;\n  if (line.endsWith(CRc)) { line = line.substring(0, line.length() - 1); }\n  String t = line.trim();\n  if (t.isEmpty()) { lastTa = null; lastEd = null; continue; }\n  boolean indented = line.startsWith(TAB) || line.startsWith(\" \");\n  int c = t.indexOf(\":\");\n  if (!indented && c > 0 && c == t.length() - 1) { section = t.substring(0, c); lastTa = null; continue; }\n  if (!indented) { section = \"\"; }\n  boolean ok = c > 0 && c <= 40 && Character.isLetter(t.charAt(0));\n  if (ok) {\n    for (int i = 0; i < c; i++) {\n      char ch = t.charAt(i);\n      if (!Character.isLetterOrDigit(ch) && \" ()-/'\".indexOf(String.valueOf(ch)) < 0) { ok = false; break; }\n    }\n  }\n  if (!ok) {\n    // a continuation line: privileges, access lists -- always two or more\n    // tabs deep; single-tab lines are Microsoft's explanatory bullets\n    if (line.startsWith(TAB + TAB) && lastTa != null) {\n      List l = (List) kv.get(lastTa); l.add(t);\n      if (lastEd != null) { ed.put(lastEd, ed.get(lastEd) + NL + t); }\n    }\n    continue;\n  }\n  String label = t.substring(0, c).trim();\n  String val = t.substring(c + 1).trim();\n  // the task's XML runs to the end of the message\n  if (label == \"Task Content\") { val = msg.substring(msg.indexOf(\"Task Content:\") + 13).trim(); q = msg.length(); }\n  // Splunk's key cleaning: non-alphanumerics become underscores\n  StringBuilder sb = new StringBuilder();\n  for (int i = 0; i < label.length(); i++) { char ch = label.charAt(i); sb.append(Character.isLetterOrDigit(ch) ? ch : (char) 95); }\n  String key = sb.toString();\n  if (!val.isEmpty()) {\n    if (!kv.containsKey(key)) { kv.put(key, new ArrayList()); }\n    ((List) kv.get(key)).add(val);\n    lastTa = key;\n  } else { lastTa = null; }\n  String k1 = code + \"|\" + section + \"|\" + label;\n  String k2 = section + \"|\" + label;\n  String name = params.ed.containsKey(k1) ? params.ed.get(k1) : params.ed.get(k2);\n  lastEd = null;\n  if (name != null && !ed.containsKey(name)) { ed.put(name, val); lastEd = name; }\n}\n\n// ---- Splunk TA fields at the top level, as Splunk has them\nfor (def en : ta.entrySet()) { ctx[en.getKey()] = en.getValue(); }\nfor (def en : kv.entrySet()) {\n  if (ctx.containsKey(en.getKey())) { continue; }\n  List v = (List) en.getValue();\n  ctx[en.getKey()] = v.size() == 1 ? v.get(0) : v;\n}\nctx.Message = msg;\nfor (String n : [\"EventCode\", \"EventType\", \"RecordNumber\", \"SidType\"]) {\n  if (ctx[n] instanceof String) { try { ctx[n] = Long.parseLong(ctx[n]); } catch (Exception x) {} }\n}\n\n// ---- ECS\nString computer = ta.get(\"ComputerName\");\nctx.message = msg;\nif (ctx.event == null) { ctx.event = new HashMap(); }\nctx.event.code = code;\nctx.event.kind = \"event\";\nctx.event.provider = ta.get(\"SourceName\");\nString kw = ta.get(\"Keywords\");\nif (kw == \"Audit Success\") { ctx.event.outcome = \"success\"; }\nelse if (kw == \"Audit Failure\") { ctx.event.outcome = \"failure\"; }\nif (params.ecs.containsKey(code)) {\n  List m = params.ecs.get(code);\n  ctx.event.category = m.get(0); ctx.event.type = m.get(1); ctx.event.action = m.get(2);\n}\nString typ = ta.get(\"Type\");\nif (typ != null) { ctx.log = ['level': typ.toLowerCase()]; }\n\nMap w = new HashMap();\nw.channel = ta.get(\"LogName\"); w.event_id = code; w.provider_name = ta.get(\"SourceName\");\nw.computer_name = computer; w.record_id = ta.get(\"RecordNumber\"); w.task = ta.get(\"TaskCategory\");\nw.opcode = ta.get(\"OpCode\");\nif (kw != null) { w.keywords = [kw]; }\nif (ta.containsKey(\"Sid\")) { w.user = ['identifier': ta.get(\"Sid\")]; }\nw.event_data = ed;\nif (ed.containsKey(\"LogonType\")) {\n  String lt = ed.get(\"LogonType\");\n  w.logon = ['type': params.logon.containsKey(lt) ? params.logon.get(lt) : lt];\n  if (ed.containsKey(\"TargetLogonId\")) { w.logon.id = ed.get(\"TargetLogonId\"); }\n}\nctx.winlog = w;\n\nif (computer != null) {\n  String c0 = computer.toLowerCase();\n  int dot = c0.indexOf(\".\");\n  ctx.host = ['name': c0, 'hostname': dot > 0 ? c0.substring(0, dot) : c0,\n              'os': ['type': 'windows', 'family': 'windows', 'platform': 'windows']];\n}\n\nList users = new ArrayList(); List ips = new ArrayList();\nString un = ed.get(\"TargetUserName\"); String ud = ed.get(\"TargetDomainName\");\nif (un == null || un == \"-\" || code == \"4672\" || code == \"4688\" || code == \"4689\" || code == \"5379\" || code == \"5140\" || code == \"5145\" || code == \"4798\" || code == \"4799\" || code == \"4732\" || code == \"4724\" || code == \"4738\" || code == \"1102\") {\n  if (ed.get(\"SubjectUserName\") != null && ed.get(\"SubjectUserName\") != \"-\") { un = ed.get(\"SubjectUserName\"); ud = ed.get(\"SubjectDomainName\"); }\n}\nif (un != null && un != \"-\") {\n  int at = un.indexOf(\"@\");\n  if (at > 0) { un = un.substring(0, at); }\n  ctx.user = ['name': un];\n  if (ud != null && ud != \"-\") { ctx.user.domain = ud; }\n  users.add(un);\n}\nif (ctx.user != null && ed.get(\"TargetUserName\") != null && ed.get(\"SubjectUserName\") != null && (code == \"4724\" || code == \"4738\" || code == \"4732\" || code == \"4798\")) {\n  ctx.user.target = ['name': ed.get(\"TargetUserName\")];\n  users.add(ed.get(\"TargetUserName\"));\n}\n\nString ip = code == \"5156\" ? ed.get(\"SourceAddress\") : ed.get(\"IpAddress\");\nif (ip != null && ip.startsWith(\"::ffff:\")) { ip = ip.substring(7); }\nif (ip != null && ip != \"-\" && ip != \"::1\" && ip.length() > 2 && Character.isDigit(ip.charAt(0))) {\n  ctx.source = ['ip': ip]; ips.add(ip);\n  String port = code == \"5156\" ? ed.get(\"SourcePort\") : ed.get(\"IpPort\");\n  if (port != null && port != \"-\" && port != \"0\") { try { ctx.source.port = Integer.parseInt(port); } catch (Exception x) {} }\n}\nif (code == \"5156\" && ed.get(\"DestAddress\") != null) {\n  ctx.destination = ['ip': ed.get(\"DestAddress\")]; ips.add(ed.get(\"DestAddress\"));\n  try { ctx.destination.port = Integer.parseInt(ed.get(\"DestPort\")); } catch (Exception x) {}\n  ctx.network = ['direction': ed.get(\"Direction\").toLowerCase(), 'iana_number': ed.get(\"Protocol\")];\n}\n\nString exe = code == \"4688\" ? ed.get(\"NewProcessName\") : ed.get(\"ProcessName\");\nif (exe != null && exe != \"-\" && exe != \"\") {\n  Map pr = new HashMap();\n  pr.executable = exe;\n  pr.name = exe.substring(exe.lastIndexOf(String.valueOf((char) 92)) + 1);\n  String pid = code == \"4688\" ? ed.get(\"NewProcessId\") : ed.get(\"ProcessId\");\n  if (pid != null && pid.startsWith(\"0x\")) { try { pr.pid = Long.parseLong(pid.substring(2), 16); } catch (Exception x) {} }\n  if (code == \"4688\") {\n    pr.command_line = ed.get(\"CommandLine\");\n    String pe = ed.get(\"ParentProcessName\");\n    if (pe != null) {\n      pr.parent = ['executable': pe, 'name': pe.substring(pe.lastIndexOf(String.valueOf((char) 92)) + 1)];\n      String pp = ed.get(\"ProcessId\");\n      if (pp != null && pp.startsWith(\"0x\")) { try { pr.parent.pid = Long.parseLong(pp.substring(2), 16); } catch (Exception x) {} }\n    }\n  }\n  ctx.process = pr;\n}\nif (code == \"4732\" || code == \"4799\") { ctx.group = ['name': ed.get(\"TargetUserName\"), 'domain': ed.get(\"TargetDomainName\")]; }\nif (code == \"7045\") { ctx.service = ['name': ed.get(\"ServiceName\")]; }\n\nMap rel = new HashMap();\nif (!users.isEmpty()) { rel.user = users; }\nif (!ips.isEmpty()) { rel.ip = ips; }\nif (ctx.host != null) { rel.hosts = [ctx.host.name]; }\nctx.related = rel;\n", "params": {"ed": {"Subject|Security ID": "SubjectUserSid", "Subject|Account Name": "SubjectUserName", "Subject|Account Domain": "SubjectDomainName", "Subject|Logon ID": "SubjectLogonId", "Subject|Domain Name": "SubjectDomainName", "Subject|Logon GUID": "LogonGuid", "Subject|Read Operation": "ReadOperation", "Creator Subject|Security ID": "SubjectUserSid", "Creator Subject|Account Name": "SubjectUserName", "Creator Subject|Account Domain": "SubjectDomainName", "Creator Subject|Logon ID": "SubjectLogonId", "Creator Subject|Domain Name": "SubjectDomainName", "Creator Subject|Logon GUID": "LogonGuid", "Creator Subject|Read Operation": "ReadOperation", "New Logon|Security ID": "TargetUserSid", "New Logon|Account Name": "TargetUserName", "New Logon|Account Domain": "TargetDomainName", "New Logon|Logon ID": "TargetLogonId", "New Logon|Linked Logon ID": "TargetLinkedLogonId", "New Logon|Network Account Name": "TargetOutboundUserName", "New Logon|Network Account Domain": "TargetOutboundDomainName", "New Logon|Logon GU