  liquid:
    parseLimit: 600000
    renderLimit: 2000
    memoryLimit: 60000000
name: wdg-zscaler-zia-web-backfill
description: 'One-shot history for Zscaler ZIA web: 3 days in 10-minute blocks, newest first,
  from the same template as wdg-zscaler-zia-web-tick. Run it once by hand. The Cisco ASA generator''s
  company seen through Zscaler Internet Access: the same users and office egress addresses,
  plus remote workers on Client Connector, browsing real SaaS with SSL inspection (finance
  and health bypassed), acceptable-use category blocks, malware and phishing blocks on random
  DGA-style domains, DLP and cloud-app-control blocks on uploads to personal storage. NSS
  v11 JSON web feed, parsed by the Elastic Zscaler ZIA integration.'
enabled: true

triggers:
  - type: manual

