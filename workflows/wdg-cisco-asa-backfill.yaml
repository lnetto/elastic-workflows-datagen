  the same template as wdg-cisco-asa-tick. Run it once by hand. Two ASAs -- an HQ internet
  edge with DMZ and AnyConnect, and a branch -- sending raw syslog (%ASA-) in the vendor''s
  own format: NAT''d outbound sessions with xlate build/teardown, inbound DMZ traffic, scanner
  sweeps, threat detection, VPN sessions and password spraying, admin activity. Parsed by
  the Elastic Cisco ASA integration.'
